# Blueprint Render : site NOLHAN OS (région Francfort, la plus proche de Lausanne).
# Render → New → Blueprint → choisir ce dépôt → Apply.
#
# Base de données : PostgreSQL externe et gratuit sans expiration (Neon, région Francfort
# « AWS Europe Central 1 »). La base gratuite de Render expire après 30 jours : on ne l'utilise plus.
# Coller l'adresse de connexion Neon dans DATABASE_URL (Render → nolhan-os → Environment).
services:
  - type: web
    name: nolhan-os
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    # Les migrations (non destructives) sont appliquées à chaque démarrage.
    # Si l'adresse Neon « pooled » (hôte en -pooler.) est collée, on utilise la connexion directe :
    # les migrations Prisma ne fonctionnent pas à travers le pooler.
    startCommand: export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | sed 's/\(@[^/]*\)-pooler\./\1./')" && npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Adresse de connexion PostgreSQL (Neon) : à saisir dans le tableau de bord Render, jamais dans Git.
      - key: DATABASE_URL
        sync: false
      # Générés automatiquement par Render à la création (256 bits, base64).
      # ⚠️ Copie ENCRYPTION_KEY dans un gestionnaire de mots de passe : sans elle, emails/téléphones chiffrés sont perdus.
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Fermées : seul le tout premier compte (base vide) peut être créé, puis plus personne.
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: AI_PROVIDER
        value: none
      - key: LOG_LEVEL
        value: info
